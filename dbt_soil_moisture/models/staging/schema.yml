model:
  - name: stg_data
    description: "Staging model for soil moisture data"
    config:
      contracts:
        enforced: true
    columns:
     
      - name: atmospheric_temp
        description: "Atmospheric temperature"
        data_type: float

      - name: soil_temp
        description: "Soil temperature"
        data_type: float

      - name: humidity
        description: "Humidity of the soil"
        data_type: float

      - name: soil_moisture
        description: "Measured soil moisture level"
        data_type: float

      - name: soil_status
        description: "Status of the soil based on moisture level"
        data_type: string